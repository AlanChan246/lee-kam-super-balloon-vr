<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#6132b9">
    <meta name="description" content="順德聯誼總會李金小學的 SUPER 氣球大挑戰。射爆氣球，集齊 S、U、P、E、R！">
    <title>李金SUPER氣球大挑戰</title>
    <script type="module" crossorigin src="./assets/index-BqHrwQCu.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BGqaLXED.css">
  </head>
  <body data-phase="menu">
    <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="0" height="0">
      <symbol id="i-clock" viewBox="0 0 24 24"><path d="M9 2h6m-3 0v3m6.1 2.5L20 5.6M12 9v4l-2 2"/><circle cx="12" cy="14" r="8"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.7 6.3.9-4.6 4.5 1.1 6.3-5.6-3-5.6 3 1.1-6.3-4.6-4.5 6.3-.9Z"/></symbol>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4.7a1.4 1.4 0 0 1 2.2-1.2l12 7.3a1.4 1.4 0 0 1 0 2.4l-12 7.3A1.4 1.4 0 0 1 6 19.3Z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1.4" fill="currentColor" stroke="none"/><rect x="14" y="4" width="4" height="16" rx="1.4" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-pad" viewBox="0 0 24 24"><path d="M7.7 7h8.6c3 0 4.3 2 5.1 5.1.8 3.1.6 5.3-1.5 5.8-2 .5-3.1-2.9-5.4-2.9h-5c-2.3 0-3.4 3.4-5.4 2.9-2.1-.5-2.3-2.7-1.5-5.8C3.4 9 4.7 7 7.7 7ZM5.9 11.6h4.4m-2.2-2.2v4.4m7.1-2.1h.01m2.6-1.6h.01"/></symbol>
      <symbol id="i-balloon" viewBox="0 0 24 24"><path d="M18.8 9.8c0 4.6-3.3 8.2-6.8 8.2s-6.8-3.6-6.8-8.2a6.8 6.8 0 1 1 13.6 0ZM12 18l-1.2 2h2.4Zm.1 2.1c.9.7.7 1.5-.5 2.4M8 9.1a4.2 4.2 0 0 1 2.2-3.4"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><path d="M12 2v5m0 10v5M2 12h5m10 0h5"/><circle cx="12" cy="12" r="7"/></symbol>
      <symbol id="i-replay" viewBox="0 0 24 24"><path d="M4 10a8.2 8.2 0 1 1 .6 6.8M4 4v6h6"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M6 10v10h4v-5h4v5h4V10"/></symbol>
      <symbol id="i-headset" viewBox="0 0 24 24"><path d="M2 8a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-3.6l-3.4-3-3.4 3H5a3 3 0 0 1-3-3V8Zm5.2 3h.1m9.4 0h.1"/></symbol>
    </svg>
    <a-scene
      id="yard"
      embedded
      light="defaultLightsEnabled: false"
      xr-mode-ui="enabled: false"
      loading-screen="enabled: false"
      device-orientation-permission-ui="enabled: false"
      webxr="referenceSpaceType: local-floor; requiredFeatures: local-floor; optionalFeatures: bounded-floor"
      renderer="antialias: true; colorManagement: true; toneMapping: no; foveationLevel: 0.75; maxCanvasWidth: 1920; maxCanvasHeight: 1200">
      <a-entity id="viewpoint" camera="near: 0.08; far: 105"></a-entity>
      <a-entity id="school"></a-entity>
    </a-scene>

    <main id="interface">
      <button id="enter-vr" class="vr-button arcade-button" type="button" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-headset"/></svg> 進入 VR
      </button>
      <p id="menu-status" class="menu-status" role="status" hidden></p>

      <section id="menu" class="menu-screen" aria-labelledby="game-title">
        <div class="menu-actions">
          <div class="hero-sign">
            <img class="hero-plaque" src="./ui/title-plaque.webp" alt="" fetchpriority="high">
            <div class="word-row hero-tiles" aria-hidden="true" data-word></div>
            <h1 id="game-title" class="hero-title"><span>李金<span class="hero-super">SUPER</span></span><span>氣球大挑戰</span></h1>
          </div>
          <p class="round-length">
            <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
            <span><span id="round-seconds">30</span> 秒挑戰</span>
          </p>
          <button id="start" class="start-button arcade-button" type="button" disabled>
            <svg class="icon" aria-hidden="true"><use href="#i-play"/></svg><span id="start-label">載入操場中…</span>
          </button>
        </div>

        <aside class="instructions" aria-labelledby="instruction-title">
          <h2 id="instruction-title"><svg class="icon" aria-hidden="true"><use href="#i-pad"/></svg>遊戲玩法</h2>
          <ul>
            <li><svg class="icon" aria-hidden="true"><use href="#i-target"/></svg><span>右手控制器瞄準，<span class="instruction-action">扣扳機射擊</span></span></li>
            <li><svg class="icon" aria-hidden="true"><use href="#i-balloon"/></svg><span>射爆一個氣球 <b>+<span id="pop-points">1</span> 分</b></span></li>
            <li><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg><span>集齊 SUPER <b>+<span id="bonus-points">10</span> 分</b></span></li>
          </ul>
        </aside>
      </section>

      <section id="ready-countdown" class="countdown-screen" aria-label="開局倒數" hidden>
        <div class="countdown-dial">
          <svg viewBox="0 0 200 200" aria-hidden="true"><circle class="dial-track" cx="100" cy="100" r="85"/><circle class="dial-arc" cx="100" cy="100" r="85" pathLength="100"/><circle class="dial-inner" cx="100" cy="100" r="74"/></svg>
          <output id="countdown-number" aria-live="off">3</output>
        </div>
        <p>準備開始</p>
      </section>

      <section id="hud" class="hud" aria-label="遊戲狀態" hidden>
        <div class="hud-pill hud-time" aria-label="剩餘時間">
          <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>
          <span><strong id="time">30</strong><small>s</small></span>
        </div>
        <div id="collection" class="word-row hud-word" aria-label="SUPER 字母收集進度" data-word></div>
        <div class="hud-pill hud-score" aria-label="分數">
          <svg class="icon icon-star" aria-hidden="true"><use href="#i-star"/></svg>
          <strong id="score">0</strong>
        </div>
      </section>
      <button id="pause" class="pause-button arcade-button" type="button" hidden>
        <svg class="icon" aria-hidden="true"><use href="#i-pause"/></svg><span>暫停</span>
      </button>
      <div id="bonus" class="bonus" aria-live="polite" hidden>SUPER BONUS <span>+10</span></div>
      <div id="aim-cursor" class="aim-cursor" aria-hidden="true" hidden><svg class="icon"><use href="#i-target"/></svg></div>

      <section id="pause-screen" class="pause-screen" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
        <div class="pause-panel">
          <h2 id="pause-title">遊戲暫停</h2>
          <p>尚餘 <strong id="pause-time">30</strong> 秒</p>
          <div class="pause-actions">
            <button id="resume" class="arcade-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-play"/></svg>繼續遊戲</button>
            <button id="restart" class="arcade-button secondary-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-replay"/></svg>重新開始</button>
            <button id="pause-home" class="arcade-button secondary-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>返回主畫面</button>
          </div>
        </div>
      </section>

      <section id="results" class="results-screen" aria-labelledby="result-heading" hidden>
        <div id="confetti" class="confetti" aria-hidden="true"></div>
        <div class="result-stack">
          <div class="trophy-wrap" aria-hidden="true"><img src="./ui/champion-trophy.webp" alt=""></div>
          <div class="result-card">
            <h2 id="result-heading" class="result-ribbon" tabindex="-1"><span>挑戰完成！</span></h2>
            <div class="result-summary">
              <p class="result-caption">你的分數</p>
              <div class="result-score"><svg class="icon icon-star" aria-hidden="true"><use href="#i-star"/></svg><output id="final-score">0</output></div>
              <p id="result-ranking" class="result-ranking" role="status"></p>
              <div class="result-collection"><span>收集字母</span><div id="final-collection" class="word-row" data-word></div></div>
              <p class="result-details"><span>射爆 <b id="final-pops">0</b> 個氣球</span><span>SUPER BONUS × <b id="final-bonuses">0</b></span></p>
            </div>
            <section class="leaderboard" aria-labelledby="leaderboard-title">
              <h3 id="leaderboard-title">排行榜 <small>頭 5 名</small></h3>
              <table id="leaderboard-table" aria-labelledby="leaderboard-title" hidden>
                <thead><tr><th scope="col">名次</th><th scope="col">挑戰者</th><th scope="col">分數</th></tr></thead>
                <tbody id="leaderboard-rows"></tbody>
              </table>
              <p id="leaderboard-empty" class="leaderboard-empty">等待成績</p>
            </section>
          </div>
          <div class="result-actions">
            <button id="replay" class="arcade-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-replay"/></svg>再玩一次</button>
            <button id="home" class="arcade-button secondary-button" type="button"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg>回主選單</button>
          </div>
        </div>
      </section>

    </main>
    <noscript>請啟用 JavaScript 後重新載入，開始李金SUPER氣球大挑戰。</noscript>
  </body>
</html>
